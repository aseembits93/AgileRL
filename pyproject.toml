[tool.poetry]
name = "agilerl"
version = "2.1.0"

description = "AgileRL is a deep reinforcement learning library focused on improving RL development through RLOps."
authors = ["Nick Ustaran-Anderegg <dev@agilerl.com>"]
license = "Apache 2.0"
readme = "README.md"
exclude = ["tutorials"]

[tool.poetry.dependencies]
python = "^3.10"
accelerate = "^1.4.0"
deepspeed = "^0.17.0"
dill = "^0.3.7"
fastrand = "^3.0.0"
flatten_dict = "^0.4.2"
gymnasium = "^1.0.0"

h5py = "^3.8.0"
hydra-core = "^1.3.2"
matplotlib = "^3.9.4"
minari = "^0.5.2"
numpy = "^2.1.0"
omegaconf = "^2.3.0"
pandas = "^2.0.3"
pettingzoo = "^1.24.0"
jax = {version = "^0.6.0", extras = ["cpu"]}
pre-commit = "^4.0.0"

scipy = "^1.12.0"
SuperSuit = "^3.9.0"
termcolor = "^2.0.0"
torch = "^2.5.1"
tensordict = "^0.8.0"
tqdm = "^4.66.4"
transformers = "^4.48.1"
ucimlrepo = "^0.0.7"
wandb = "^0.20.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
